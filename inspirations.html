<!DOCTYPE html>
<html lang="en">

<head>

<body class="page-shell inspo-page">
  <aside id="inspo-card" class="inspo-card" aria-labelledby="inspo-title">

      <p class="inspo-sub">these are all pieces of content where after i consumed them, i was better.</p>

        <div class="inspo-popup-actions">
          <button type="button" class="page-btn" id="inspo-prev" aria-label="Previous">←</button>
          <button type="button" class="page-btn" id="inspo-next" aria-label="Next">→</button>
          <button type="button" class="page-btn secondary" id="inspo-close">CLOSE [ESC]</button>

  </div>
